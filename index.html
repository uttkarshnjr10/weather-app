<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div class="weather-container">
            <div class="search">
                <input type="text" placeholder="Enter the city name" spellcheck="false">
                <button class="searchbar">
                    <img src="images/search.png" alt="Search">
                </button>
            </div>
            <div class="error">
                Invalid city name. Please try again.
            </div>
            <div class="weather">
                <img src="images/rain.png" class="weather-icon">
                <h1 class="temp">22°C</h1>
                <h2 class="city">Mokama</h2>
                <div class="details">
                    <div class="col">
                        <img src="images/humidity.png">
                        <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="col">
                        <img src="images/wind.png">
                        <div>
                            <p class="wind">15 km/h</p>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                </div>
                <div class="advisory">
                    <p class="advisory-message"></p>
                </div>
            </div>
        </div>
        <div class="chatbot-container">
            <div class="chatbot">
                <h3>Weather Termology</h3>
                <select class="language-selector">
                    <option value="english">English</option>
                    <option value="hindi">Hindi</option>
                </select>
                <select class="chatbot-questions">
                    <option value="" disabled selected>Select a question</option>
                    <option value="humidity">What is humidity?</option>
                    <option value="heatstroke">What are heat strokes?</option>
                    <option value="windspeed">How does wind speed affect weather?</option>
                    <option value="uvindex">What is the UV index?</option>
                </select>
                <div class="chatbot-response"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
